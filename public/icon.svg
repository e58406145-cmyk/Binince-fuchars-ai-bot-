<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Radar Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0891b2" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.6" />
  <circle cx="256" cy="256" r="50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" />

  <!-- Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.35" />
  <line x1="46" y1="256" x2="466" y2="256" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.35" />

  <!-- Radar Sweep wedge -->
  <path d="M 256 256 L 256 86 A 170 170 0 0 1 376 135 Z" fill="url(#cyanGrad)" fill-opacity="0.25" />

  <!-- Center Symbol: Cyber Pulse / Candlestick Emblem -->
  <!-- Bullish Candle left -->
  <line x1="190" y1="180" x2="190" y2="330" stroke="#10b981" stroke-width="3" />
  <rect x="180" y="210" width="20" height="80" rx="3" fill="#10b981" filter="url(#glow)" />

  <!-- Center Pulse Line -->
  <path d="M 120 256 L 200 256 L 225 190 L 256 320 L 285 220 L 310 256 L 392 256" 
        fill="none" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Bearish/Bullish Candle right -->
  <line x1="330" y1="170" x2="330" y2="340" stroke="#06b6d4" stroke-width="3" />
  <rect x="320" y="200" width="20" height="70" rx="3" fill="#06b6d4" filter="url(#glow)" />

  <!-- Outer Neon Edge Accent Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.85" filter="url(#glow)" />

  <!-- Corner Tech Accents -->
  <path d="M 60 110 L 60 60 L 110 60" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
  <path d="M 452 110 L 452 60 L 402 60" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
  <path d="M 60 402 L 60 452 L 110 452" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
  <path d="M 452 402 L 452 452 L 402 452" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" />
</svg>
